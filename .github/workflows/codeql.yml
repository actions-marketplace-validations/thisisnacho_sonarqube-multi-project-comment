name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 8 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@eb94de7c5cfc51dc10fff26d52210eb23a589b0e # v4.35.4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@eb94de7c5cfc51dc10fff26d52210eb23a589b0e # v4.35.4
        with:
          category: "/language:${{ matrix.language }}"
